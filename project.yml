name: SnakeGame
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  SnakeGame:
    type: application
    platform: iOS
    sources:
      - SnakeGame
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Змейка
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.snakegame
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  SnakeGame:
    build:
      targets:
        SnakeGame: all
    run:
      config: Release
    archive:
      config: Release